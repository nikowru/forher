<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title></title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<!-- Phase 3.1 S2: sign-up-only typography (Dancing Script for .su-title/#su-final-q, Quicksand for
     labels/inputs/buttons/track names) - added alongside the link above, which still serves
     Pinyon Script/Cormorant Garamond to every other screen; nothing here replaces that link. -->
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<section class="signup" id="signup" aria-labelledby="su-title">
  <div class="su-card">
    <h1 class="su-title" id="su-title"></h1>
    <form class="su-form" id="su-form" novalidate>
      <div class="su-step" data-step="username">
        <label class="su-label" for="su-username"></label>
        <input class="su-input" type="text" id="su-username" name="username" autocomplete="off" maxlength="40">
      </div>
      <div class="su-step" data-step="mood">
        <p class="su-label" id="su-mood-label"></p>
        <div class="su-moods" id="su-moods" role="group" aria-labelledby="su-mood-label"></div>
      </div>
      <div class="su-step" data-step="icon">
        <p class="su-label" id="su-icon-label"></p>
        <div class="su-icons" id="su-icons" role="group" aria-labelledby="su-icon-label"></div>
      </div>
      <div class="su-step" data-step="music">
        <p class="su-label" id="su-music-label"></p>
        <ul class="su-tracks" id="su-tracks" role="list"></ul>
      </div>
      <div class="su-step su-final" data-step="final">
        <p class="su-label" id="su-final-q"></p>
        <p class="su-msg" id="su-msg" role="status" aria-live="polite" hidden></p>
        <div class="su-yesno" role="group" aria-labelledby="su-final-q">
          <button type="submit" class="su-yes" id="su-yes"></button>
          <button type="button" class="su-no" id="su-no"></button>
        </div>
      </div>
      <div class="su-hp" aria-hidden="true">
        <label for="su-website">Website</label>
        <input type="text" id="su-website" name="website" tabindex="-1" autocomplete="off">
      </div>
    </form>
  </div>
</section>
<div id="air" aria-hidden="true"></div>
<button class="theme" id="theme"></button>
<button class="inbox" id="inbox" type="button" hidden>
  <span class="inbox-badge" id="inbox-badge" hidden></span>
</button>
<dialog class="inbox-view" id="inbox-view" aria-labelledby="inbox-title">
  <div class="inbox-box">
    <button class="inbox-close" id="inbox-close" type="button"><span aria-hidden="true">&times;</span></button>
    <h3 id="inbox-title"></h3>
    <p id="inbox-text"></p>
  </div>
</dialog>
<main class="stage" id="stage">
  <p class="intro-msg" id="intro-msg"></p>
  <h1 id="title"></h1>
  <div class="scene" id="scene">
    <div class="book" aria-hidden="true"></div>
    <div class="back"></div>
    <div class="letter" id="letter" inert><div class="text" id="text"></div>
      <form class="reply" id="reply-form" novalidate>
        <label class="reply-label" for="reply-text"></label>
        <textarea class="reply-text" id="reply-text" maxlength="500"></textarea>
        <p class="reply-nudge" id="reply-nudge" role="status" hidden></p>
        <div class="reply-hp" aria-hidden="true">
          <label for="reply-website">Website</label>
          <input type="text" id="reply-website" name="website" tabindex="-1" autocomplete="off">
        </div>
        <button type="submit" class="reply-submit" id="reply-submit"></button>
      </form>
      <button class="go" id="go" hidden></button></div>
    <svg class="front" viewBox="0 0 100 64" preserveAspectRatio="none" aria-hidden="true">
      <polygon points="0,0 50,36 0,64"/>
      <polygon points="100,0 50,36 100,64"/>
      <polygon points="0,64 50,30 100,64"/>
    </svg>
    <div class="flap"></div>
    <svg class="flowers" viewBox="0 0 100 160" aria-hidden="true">
      <defs><g id="u"><circle r="4"/><circle cx="-7" cy="3" r="3.4"/><circle cx="7" cy="3" r="3.4"/><circle cx="-4" cy="-6" r="3.2"/><circle cx="5" cy="-6" r="3.2"/><circle cx="-10" cy="-3" r="2.6"/><circle cx="11" cy="-2" r="2.6"/></g></defs>
      <g class="stems" fill="none" stroke-width="1.6" stroke-linecap="round"><path d="M50 150C48 110 44 80 30 42"/><path d="M50 150C53 100 62 68 72 32"/><path d="M50 150C50 118 50 90 54 62"/></g>
      <use href="#u" transform="translate(30 40)"/><use href="#u" transform="translate(72 30)"/><use href="#u" transform="translate(54 58) scale(.85)"/>
      <rect class="tape" x="20" y="126" width="48" height="14" opacity=".92" transform="rotate(-8 44 133)"/>
    </svg>
    <button class="seal" id="seal">
      <svg viewBox="0 0 40 40" stroke-width="1.2" stroke-linecap="round" aria-hidden="true">
        <path d="M20 20C10 9 3 14 6 20C3 26 10 31 20 20Z"/><path d="M20 20C30 9 37 14 34 20C37 26 30 31 20 20Z"/>
        <circle cx="20" cy="20" r="3"/><path d="M19 23L14 35M21 23L26 35" fill="none"/>
      </svg>
    </button>
  </div>
  <p class="hint" id="hint"></p>
</main>
<section class="gallery" id="gallery" aria-labelledby="g-title" hidden>
  <header class="g-head">
    <h2 id="g-title" tabindex="-1"></h2>
    <p class="g-sub" id="g-sub"></p>
  </header>
  <div class="tabs" id="tabs" role="tablist"></div>
  <p class="g-msg" id="g-msg" role="status"></p>
  <div id="panel" role="tabpanel"><ul class="grid" id="grid"></ul></div>
</section>
<dialog class="player" id="player" aria-labelledby="p-title">
  <div class="p-box">
    <button class="p-close" id="p-close" type="button"><span aria-hidden="true">&times;</span></button>
    <div class="p-video" id="p-video"></div>
    <div class="p-info">
      <div class="p-text">
        <h3 id="p-title"></h3>
        <p id="p-caption"></p>
      </div>
      <div class="p-nav" id="p-nav">
        <button class="p-step" id="p-prev" type="button"><span aria-hidden="true">&larr;</span></button>
        <span class="p-count" id="p-count"></span>
        <button class="p-step" id="p-next" type="button"><span aria-hidden="true">&rarr;</span></button>
      </div>
    </div>
  </div>
</dialog>
<script src="script.js"></script>
</body>
</html>
