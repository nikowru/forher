<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title></title>
<!-- Documented exception: assets/favicon.svg can't read CSS variables, so it uses approved palette hexes directly. -->
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<!-- Phase 3.1 S2: sign-up-only typography (Dancing Script for .su-title, Quicksand for
     labels/inputs/buttons/track names) - added alongside the link above, which still serves
     Pinyon Script/Cormorant Garamond to every other screen; nothing here replaces that link. -->
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="hearts">
<section class="signup" id="signup" aria-labelledby="su-title">
  <div class="su-card">
    <h1 class="su-title" id="su-title"></h1>
    <form class="su-form" id="su-form" novalidate>
      <div class="su-step" data-step="username">
        <label class="su-label" for="su-username"></label>
        <input class="su-input" type="text" id="su-username" name="username" autocomplete="off" maxlength="40">
      </div>
      <div class="su-step" data-step="secret">
        <label class="su-label" for="su-secret"></label>
        <input class="su-input" type="text" id="su-secret" autocapitalize="off" spellcheck="false" name="secret" autocomplete="off" maxlength="60" aria-describedby="su-secret-hint">
        <p class="su-hint" id="su-secret-hint"></p>
      </div>
      <div class="su-step" data-step="mood">
        <p class="su-label" id="su-mood-label"></p>
        <div class="su-moods" id="su-moods" role="group" aria-labelledby="su-mood-label"></div>
      </div>
      <div class="su-step" data-step="icon">
        <p class="su-label" id="su-icon-label"></p>
        <div class="su-icons" id="su-icons" role="group" aria-labelledby="su-icon-label"></div>
      </div>
      <div class="su-step su-final" data-step="final">
        <p class="su-msg" id="su-msg" role="status" aria-live="polite" hidden></p>
        <button type="submit" class="su-continue" id="su-continue"></button>
      </div>
      <div class="su-hp" aria-hidden="true">
        <label for="su-website">Website</label>
        <input type="text" id="su-website" name="website" tabindex="-1" autocomplete="off">
      </div>
    </form>
  </div>
</section>
<div id="air" aria-hidden="true"></div>
<button class="theme" id="theme"></button>
<script src="js/config.js" defer></script>
<script src="js/common.js" defer></script>
<script src="js/api.js" defer></script>
<script src="js/signup.js" defer></script>
</body>
</html>
