<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>A letter for you</title>
<!-- Documented exception: assets/favicon.svg can't read CSS variables, so it uses approved palette hexes directly. -->
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="site">
<!-- CANONICAL CHROME (Phase 4 A3): memories.html and inbox.html copy this header and footer verbatim,
     changing only which nav link carries .is-current + aria-current="page". Text is filled from CONFIG at
     runtime (A4); the nav items for pages she hasn't unlocked get .is-locked + aria-disabled="true". -->
<header class="site-header" id="site-header">
  <p class="hdr-brand" id="brand"></p>
  <nav class="hdr-nav" aria-label="Pages">
    <a class="hdr-link is-current" id="nav-letter" href="letter.html" aria-current="page">Letter</a>
    <a class="hdr-link" id="nav-memories" href="memories.html">Memories</a>
    <a class="hdr-link" id="nav-inbox" href="inbox.html">Inbox</a>
  </nav>
  <div class="hdr-actions">
    <button class="hdr-resume" id="hdr-resume" type="button" hidden>Tap to resume music</button>
    <a class="hdr-btn hdr-inbox" id="hdr-inbox" href="inbox.html" aria-label="Inbox"><span class="hdr-badge" id="hdr-inbox-badge" hidden></span></a>
    <button class="hdr-btn" id="hdr-mute" type="button" aria-label="Mute music">&#128266;</button>
    <button class="hdr-btn" id="hdr-theme" type="button" aria-label="Switch theme">&#9790;</button>
  </div>
</header>
<main class="site-main letter-main" id="main">
  <section class="stage" id="stage">
    <h1 id="title"></h1>
    <div class="scene" id="scene">
      <div class="book" aria-hidden="true"></div>
      <div class="back"></div>
      <div class="letter" id="letter" inert><div class="text" id="text"></div>
        <form class="reply" id="reply-form" novalidate>
          <label class="reply-label" for="reply-text"></label>
          <textarea class="reply-text" id="reply-text" maxlength="500"></textarea>
          <p class="reply-nudge" id="reply-nudge" role="status" hidden></p>
          <div class="reply-hp" aria-hidden="true">
            <label for="reply-website">Website</label>
            <input type="text" id="reply-website" name="website" tabindex="-1" autocomplete="off">
          </div>
          <button type="submit" class="reply-submit" id="reply-submit"></button>
        </form>
        <button class="go" id="go" hidden></button></div>
      <svg class="front" viewBox="0 0 100 64" preserveAspectRatio="none" aria-hidden="true">
        <polygon points="0,0 50,36 0,64"/>
        <polygon points="100,0 50,36 100,64"/>
        <polygon points="0,64 50,30 100,64"/>
      </svg>
      <div class="flap"></div>
      <svg class="flowers" viewBox="0 0 100 160" aria-hidden="true">
        <defs><g id="u"><circle r="4"/><circle cx="-7" cy="3" r="3.4"/><circle cx="7" cy="3" r="3.4"/><circle cx="-4" cy="-6" r="3.2"/><circle cx="5" cy="-6" r="3.2"/><circle cx="-10" cy="-3" r="2.6"/><circle cx="11" cy="-2" r="2.6"/></g></defs>
        <g class="stems" fill="none" stroke-width="1.6" stroke-linecap="round"><path d="M50 150C48 110 44 80 30 42"/><path d="M50 150C53 100 62 68 72 32"/><path d="M50 150C50 118 50 90 54 62"/></g>
        <use href="#u" transform="translate(30 40)"/><use href="#u" transform="translate(72 30)"/><use href="#u" transform="translate(54 58) scale(.85)"/>
        <rect class="tape" x="20" y="126" width="48" height="14" opacity=".92" transform="rotate(-8 44 133)"/>
      </svg>
      <button class="seal" id="seal">
        <svg viewBox="0 0 40 40" stroke-width="1.2" stroke-linecap="round" aria-hidden="true">
          <path d="M20 20C10 9 3 14 6 20C3 26 10 31 20 20Z"/><path d="M20 20C30 9 37 14 34 20C37 26 30 31 20 20Z"/>
          <circle cx="20" cy="20" r="3"/><path d="M19 23L14 35M21 23L26 35" fill="none"/>
        </svg>
      </button>
    </div>
    <p class="hint" id="hint"></p>
    <a class="to-memories" id="to-memories" href="memories.html" hidden></a>
  </section>
</main>
<footer class="site-footer" id="site-footer">
  <p class="site-footer-text" id="site-footer-text"></p>
</footer>
<div class="notif" id="notif" role="status" hidden>
  <button class="notif-btn" id="notif-btn" type="button">
    <span class="notif-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.2"/><path d="M3.5 6.5L12 13l8.5-6.5"/></svg></span>
    <span class="notif-text" id="notif-text"></span>
  </button>
</div>
<div id="air" aria-hidden="true"></div>
<script src="js/config.js" defer></script>
<script src="js/common.js" defer></script>
<script src="js/api.js" defer></script>
<script src="js/letter.js" defer></script>
</body>
</html>
