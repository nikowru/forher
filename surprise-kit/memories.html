<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Our memories</title>
<!-- Documented exception: assets/favicon.svg can't read CSS variables, so it uses approved palette hexes directly. -->
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="site">
<header class="site-header" id="site-header">
  <p class="hdr-brand" id="brand"></p>
  <nav class="hdr-nav" aria-label="Pages">
    <a class="hdr-link is-current" id="nav-memories" href="memories.html" aria-current="page">Memories</a>
    <a class="hdr-link" id="nav-inbox" href="inbox.html">Inbox</a>
    <a class="hdr-link" id="nav-profile" href="profile.html">Profile</a>
  </nav>
  <div class="hdr-actions">
    <a class="hdr-btn hdr-inbox" id="hdr-inbox" href="inbox.html" aria-label="Inbox"><span class="hdr-badge" id="hdr-inbox-badge" hidden></span></a>
    <button class="hdr-btn" id="hdr-theme" type="button" aria-label="Switch theme">&#9790;</button>
  </div>
</header>
<main class="site-main memories-main" id="main">
  <section class="gallery" id="gallery" aria-labelledby="g-title">
    <header class="g-head">
      <h2 id="g-title" tabindex="-1"></h2>
      <p class="g-sub" id="g-sub"></p>
    </header>
    <div class="tabs" id="tabs" role="tablist"></div>
    <p class="g-msg" id="g-msg" role="status"></p>
    <div id="panel" role="tabpanel"><ul class="grid" id="grid"></ul></div>
  </section>
</main>
<footer class="site-footer" id="site-footer">
  <p class="site-footer-text" id="site-footer-text"></p>
</footer>
<dialog class="player" id="player" aria-labelledby="p-title">
  <div class="p-box">
    <button class="p-close" id="p-close" type="button"><span aria-hidden="true">&times;</span></button>
    <div class="p-video" id="p-video"></div>
    <div class="p-info">
      <div class="p-text">
        <h3 id="p-title"></h3>
        <p id="p-caption"></p>
      </div>
      <div class="p-nav" id="p-nav">
        <button class="p-step" id="p-prev" type="button"><span aria-hidden="true">&larr;</span></button>
        <span class="p-count" id="p-count"></span>
        <button class="p-step" id="p-next" type="button"><span aria-hidden="true">&rarr;</span></button>
      </div>
    </div>
  </div>
</dialog>
<!-- The letter is delivered here now, as a fixed layer over the gallery: the notification pops, the
     envelope falls in, and the page behind stays dimmed and inert until she has written her reply.
     js/letter.js mounts this; with the reply already saved it never shows at all. -->
<div class="letter-over" id="letter-over" hidden>
  <!-- me, arriving beside the paper with the flowers once the letter has settled (js/letter.js places it) -->
  <img class="me-arrive" id="me-arrive" src="assets/me/me-shy.png" alt="" width="196" height="348" hidden>
  <section class="stage" id="stage">
    <h1 id="title"></h1>
    <div class="scene" id="scene">
      <div class="book" aria-hidden="true"></div>
      <div class="back"></div>
      <div class="letter" id="letter" inert><div class="text" id="text"></div>
        <!-- the sheet's foot: page turns either side of the page count when the letter runs over more than one page,
             and the button that puts it away (only on the last page) -->
        <div class="foot"><button class="leaf-turn" id="leaf-prev" type="button" hidden></button><span class="leaf-count" id="leaf-count" aria-live="polite" hidden></span><button class="leaf-turn" id="leaf-next" type="button" hidden></button><button class="go" id="go" hidden></button></div></div>
      <svg class="front" viewBox="0 0 100 64" preserveAspectRatio="none" aria-hidden="true">
        <polygon points="0,0 50,36 0,64"/>
        <polygon points="100,0 50,36 100,64"/>
        <polygon points="0,64 50,30 100,64"/>
      </svg>
      <div class="flap"></div>
      <svg class="flowers" viewBox="0 0 100 160" aria-hidden="true">
        <defs><g id="u"><circle r="4"/><circle cx="-7" cy="3" r="3.4"/><circle cx="7" cy="3" r="3.4"/><circle cx="-4" cy="-6" r="3.2"/><circle cx="5" cy="-6" r="3.2"/><circle cx="-10" cy="-3" r="2.6"/><circle cx="11" cy="-2" r="2.6"/></g></defs>
        <g class="stems" fill="none" stroke-width="1.6" stroke-linecap="round"><path d="M50 150C48 110 44 80 30 42"/><path d="M50 150C53 100 62 68 72 32"/><path d="M50 150C50 118 50 90 54 62"/></g>
        <use href="#u" transform="translate(30 40)"/><use href="#u" transform="translate(72 30)"/><use href="#u" transform="translate(54 58) scale(.85)"/>
        <rect class="tape" x="20" y="126" width="48" height="14" opacity=".92" transform="rotate(-8 44 133)"/>
      </svg>
      <button class="seal" id="seal">
        <svg viewBox="0 0 40 40" stroke-width="1.2" stroke-linecap="round" aria-hidden="true">
          <path d="M20 20C10 9 3 14 6 20C3 26 10 31 20 20Z"/><path d="M20 20C30 9 37 14 34 20C37 26 30 31 20 20Z"/>
          <circle cx="20" cy="20" r="3"/><path d="M19 23L14 35M21 23L26 35" fill="none"/>
        </svg>
      </button>
    </div>
    <p class="hint" id="hint"></p>
  </section>
</div>
<div class="notif" id="notif" role="status" hidden>
  <button class="notif-btn" id="notif-btn" type="button">
    <span class="notif-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.2"/><path d="M3.5 6.5L12 13l8.5-6.5"/></svg></span>
    <span class="notif-text" id="notif-text"></span>
  </button>
</div>
<div id="air" aria-hidden="true"></div>
<script src="js/config.js" defer></script>
<script src="js/common.js" defer></script>
<script src="js/api.js" defer></script>
<script src="js/memories.js" defer></script>
<script src="js/letter.js" defer></script>
</body>
</html>
