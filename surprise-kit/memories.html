<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Our memories</title>
<!-- Documented exception: assets/favicon.svg can't read CSS variables, so it uses approved palette hexes directly. -->
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="site">
<header class="site-header" id="site-header">
  <p class="hdr-brand" id="brand"></p>
  <nav class="hdr-nav" aria-label="Pages">
    <a class="hdr-link" id="nav-letter" href="letter.html">Letter</a>
    <a class="hdr-link is-current" id="nav-memories" href="memories.html" aria-current="page">Memories</a>
    <a class="hdr-link" id="nav-inbox" href="inbox.html">Inbox</a>
  </nav>
  <div class="hdr-actions">
    <button class="hdr-resume" id="hdr-resume" type="button" hidden>Tap to resume music</button>
    <a class="hdr-btn hdr-inbox" id="hdr-inbox" href="inbox.html" aria-label="Inbox"><span class="hdr-badge" id="hdr-inbox-badge" hidden></span></a>
    <button class="hdr-btn" id="hdr-mute" type="button" aria-label="Mute music">&#128266;</button>
    <button class="hdr-btn" id="hdr-theme" type="button" aria-label="Switch theme">&#9790;</button>
  </div>
</header>
<main class="site-main memories-main" id="main">
  <section class="gallery" id="gallery" aria-labelledby="g-title">
    <header class="g-head">
      <h2 id="g-title" tabindex="-1"></h2>
      <p class="g-sub" id="g-sub"></p>
    </header>
    <div class="tabs" id="tabs" role="tablist"></div>
    <p class="g-msg" id="g-msg" role="status"></p>
    <div id="panel" role="tabpanel"><ul class="grid" id="grid"></ul></div>
  </section>
</main>
<footer class="site-footer" id="site-footer">
  <p class="site-footer-text" id="site-footer-text"></p>
</footer>
<dialog class="player" id="player" aria-labelledby="p-title">
  <div class="p-box">
    <button class="p-close" id="p-close" type="button"><span aria-hidden="true">&times;</span></button>
    <div class="p-video" id="p-video"></div>
    <div class="p-info">
      <div class="p-text">
        <h3 id="p-title"></h3>
        <p id="p-caption"></p>
      </div>
      <div class="p-nav" id="p-nav">
        <button class="p-step" id="p-prev" type="button"><span aria-hidden="true">&larr;</span></button>
        <span class="p-count" id="p-count"></span>
        <button class="p-step" id="p-next" type="button"><span aria-hidden="true">&rarr;</span></button>
      </div>
    </div>
  </div>
</dialog>
<div id="air" aria-hidden="true"></div>
<script src="js/config.js" defer></script>
<script src="js/common.js" defer></script>
<script src="js/api.js" defer></script>
<script src="js/memories.js" defer></script>
</body>
</html>
