<!doctype html>
<html lang="en" data-theme>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>You</title>
<meta name="description" content="A little card, just for her.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Dancing+Script:wght@600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="site">
<header class="site-header" id="site-header">
  <p class="hdr-brand" id="brand"></p>
  <nav class="hdr-nav" aria-label="Pages">
    <a class="hdr-link" id="nav-memories" href="memories.html">Memories</a>
    <a class="hdr-link" id="nav-inbox" href="inbox.html">Inbox</a>
    <a class="hdr-link is-current" id="nav-profile" href="profile.html" aria-current="page">Profile</a>
  </nav>
  <div class="hdr-actions">
    <a class="hdr-btn hdr-inbox" id="hdr-inbox" href="inbox.html" aria-label="Inbox"><span class="hdr-badge" id="hdr-inbox-badge" hidden></span></a>
    <button class="hdr-btn" id="hdr-theme" type="button" aria-label="Switch theme">&#9790;</button>
  </div>
</header>

<main class="site-main profile-main" id="main">
  <!-- Her card is written as a letter about her, not printed as a form: every detail is set into a
       sentence, and the words on either side of each value live in CONFIG.profile as .lead/.tail.
       The field labels are still here and still carry the accessible name of each field - they are
       just read, not shown, because the sentence already says what the value is.

       Each changeable detail is one .pf-item: the sentence, then the button that changes it
       underneath, then whatever that button opens. The buttons sit below their line rather than
       inside it so they are easy to hit and do not interrupt the sentence as it is read.
       Nothing on the sheet is underlined - the buttons carry the whole affordance, so an underline
       can never be mistaken for something clickable.
       The sheet never moves; only #pf-photo answers the cursor. -->
  <section class="pf" id="pf" aria-labelledby="pf-name">

    <!-- the letter's date -->
    <p class="pf-date" id="pf-since"></p>

    <div class="pf-head">
      <!-- the print that came with it, mounted in its own white border, with the icon she chose at
           sign-up stamped on it. The mount stays put; the print inside it is the loose part. -->
      <figure class="pf-photo">
        <img class="pf-photo-img" id="pf-photo" src="assets/profile/her-1.jpg" alt="" width="640" height="640">
        <span class="pf-badge"><img class="pf-badge-img" id="pf-avatar" alt="" width="56" height="56"></span>
      </figure>

      <!-- the salutation: her own name, in her own hand, carrying the top of the page -->
      <div class="pf-salute">
        <p class="pf-sr" id="pf-name-label"></p>
        <h1 class="pf-name" id="pf-name"></h1>
        <div class="pf-acts">
          <button class="pf-act" type="button" id="pf-name-edit"></button>
        </div>
        <form class="pf-form" id="pf-nameform" hidden>
          <label class="pf-sr" for="pf-name-input" id="pf-name-input-label"></label>
          <input class="su-input pf-input" id="pf-name-input" type="text" maxlength="60" autocomplete="off">
          <button class="pf-save" type="submit" id="pf-name-save"></button>
        </form>
      </div>
    </div>

    <div class="pf-body">
      <!-- how she feels, with the gif set in the line itself -->
      <div class="pf-item">
        <p class="pf-line">
          <span class="pf-sr" id="pf-mood-label"></span>
          <span id="pf-mood-lead"></span>
          <img class="pf-mood-img" id="pf-mood-img" alt="" width="64" height="64" hidden>
          <span class="pf-val pf-mood-val" id="pf-mood-text"></span><span id="pf-mood-tail"></span>
        </p>
        <div class="pf-acts">
          <button class="pf-act" type="button" id="pf-mood-edit"></button>
        </div>
        <div class="pf-mood-pick" id="pf-mood-pick" hidden role="group"></div>
      </div>

      <!-- the secret word. On a device that was never told to remember her, js/profile.js hides the
           words on either side and the value carries the whole line instead. -->
      <div class="pf-item">
        <p class="pf-line">
          <span class="pf-sr" id="pf-secret-label"></span>
          <span id="pf-secret-lead"></span>
          <span class="pf-val pf-secret-val" id="pf-secret-val"></span><span id="pf-secret-tail"></span>
        </p>
        <div class="pf-acts">
          <button class="pf-act" type="button" id="pf-secret-toggle" hidden></button>
          <button class="pf-act" type="button" id="pf-secret-change"></button>
        </div>
        <form class="pf-form" id="pf-secretform" hidden>
          <label class="pf-sr" for="pf-secret-input" id="pf-secret-input-label"></label>
          <input class="su-input pf-input" id="pf-secret-input" type="text" maxlength="100" autocomplete="off" autocapitalize="off" spellcheck="false">
          <button class="pf-save" type="submit" id="pf-secret-save"></button>
        </form>
      </div>

      <!-- her rank. The words name the game, so the line still reads if the icon file is gone. -->
      <div class="pf-item">
        <p class="pf-line">
          <span class="pf-sr" id="pf-rank-label"></span>
          <span id="pf-rank-lead"></span>
          <img class="pf-rank-img" id="pf-rank-img" alt="" width="48" height="48" hidden>
          <span class="pf-val" id="pf-rank-text"></span><span id="pf-rank-tail"></span>
        </p>
      </div>
    </div>

    <!-- what was enclosed with the letter: the record, and the two of us in pixels -->
    <div class="pf-enclosed">
      <div class="pf-tunes">
        <p class="pf-lead-in" id="pf-tunes-label"></p>
        <div class="pf-tunes-embed" id="pf-tunes-embed"></div>
      </div>
      <figure class="pf-us">
        <p class="pf-sr" id="pf-us-label"></p>
        <img class="pf-us-img" id="pf-us-img" src="assets/profile/us-pixel.png" alt="" width="295" height="520">
        <figcaption class="pf-us-cap" id="pf-us-cap"></figcaption>
      </figure>
    </div>

    <p class="pf-sign" id="pf-sign"></p>
    <p class="su-msg pf-msg" id="pf-msg" role="status" aria-live="polite" hidden></p>

  </section>

  <!-- writing to me, straight from her card (S.Compose in js/common.js, .wr in style.css): me standing beside
       it, glad once she has sent it. The only place she writes to me. -->
  <section class="wr" id="pf-write" aria-labelledby="pf-write-label">
    <img class="wr-me" id="pf-write-me" src="assets/me/me-proud.png" data-happy="assets/me/me-excited.png" alt="" width="174" height="412">
    <form class="wr-form" id="pf-write-form" novalidate>
      <label class="wr-label" for="pf-write-text" id="pf-write-label"></label>
      <textarea class="su-input wr-text" id="pf-write-text" rows="5" maxlength="4000"></textarea>
      <p class="wr-msg" id="pf-write-msg" role="status" aria-live="polite" hidden></p>
      <button class="wr-send" type="submit" id="pf-write-send"></button>
    </form>
    <div class="wr-sent" id="pf-write-sent" role="status" hidden>
      <p class="wr-sent-title" id="pf-write-sent-title"></p>
      <p class="wr-sent-text" id="pf-write-sent-text"></p>
      <button class="wr-again" type="button" id="pf-write-again"></button>
    </div>
  </section>
</main>

<footer class="site-footer" id="site-footer">
  <p class="site-footer-text" id="site-footer-text"></p>
</footer>
<div id="air" aria-hidden="true"></div>

<script src="js/config.js" defer></script>
<script src="js/common.js" defer></script>
<script src="js/api.js" defer></script>
<script src="js/profile.js" defer></script>
</body>
</html>
