<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title></title>
<!-- Documented exception: assets/favicon.svg can't read CSS variables, so it uses approved palette hexes directly. -->
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<!-- Phase 3.1 S2: sign-up-only typography (Dancing Script for .su-title, Quicksand for
     labels/inputs/buttons/track names) - added alongside the link above, which still serves
     Pinyon Script/Cormorant Garamond to every other screen; nothing here replaces that link. -->
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<section class="signup" id="login" aria-labelledby="lg-title">
  <div class="su-card lg-card">
    <h1 class="su-title" id="lg-title"></h1>
    <form class="lg-form" id="lg-form" novalidate>
      <div class="su-step">
        <label class="su-label" for="lg-username"></label>
        <input class="su-input" type="text" id="lg-username" name="username" autocomplete="off" maxlength="40">
      </div>
      <div class="su-step">
        <label class="su-label" for="lg-secret"></label>
        <input class="su-input" type="text" id="lg-secret" autocapitalize="off" spellcheck="false" name="secret" autocomplete="off" maxlength="60">
      </div>
      <div class="lg-actions">
        <p class="su-msg" id="lg-msg" role="status" aria-live="polite" hidden></p>
        <button type="submit" class="su-continue" id="lg-continue"></button>
        <button type="button" class="lg-reset" id="lg-reset"></button>
      </div>
    </form>
  </div>
</section>
<dialog class="lg-confirm" id="lg-confirm" aria-labelledby="lg-confirm-title" aria-describedby="lg-confirm-text">
  <h2 class="lg-confirm-title" id="lg-confirm-title"></h2>
  <p class="lg-confirm-text" id="lg-confirm-text"></p>
  <div class="lg-confirm-btns">
    <button type="button" class="lg-confirm-no" id="lg-confirm-no"></button>
    <button type="button" class="lg-confirm-yes" id="lg-confirm-yes"></button>
  </div>
</dialog>
<div id="air" aria-hidden="true"></div>
<button class="theme" id="theme"></button>
<script src="js/config.js" defer></script>
<script src="js/common.js" defer></script>
<script src="js/api.js" defer></script>
<script src="js/login.js" defer></script>
</body>
</html>
